name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One at a time: the first job to finish creates the draft release, and
      # the rest find it. Run them together and each creates its own draft,
      # scattering the installers across three of them.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: cd src-tauri && cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # To sign and notarize, add the APPLE_CERTIFICATE,
          # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD and APPLE_TEAM_ID secrets and pass them here. They
          # cannot be passed unconditionally: an unset secret arrives as an
          # empty string, which Tauri reads as "sign with this", and the
          # keychain import then fails the build.
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Token Ledger ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}

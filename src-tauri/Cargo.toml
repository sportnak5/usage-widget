[package]
name = "token-ledger"
version = "0.3.0"
description = "Claude Code usage: the three limits, opened up by what filled them."
authors = ["Crawford Nakayama"]
edition = "2021"
default-run = "token-ledger"
rust-version = "1.77"

[lib]
name = "token_ledger"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "token-ledger"
path = "src/main.rs"

[[bin]]
name = "ledger-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "usage-probe"
path = "src/bin/usage-probe.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# The Usage endpoint. ureq is sync, which is what the engine is, and pulls no
# async runtime in behind it.
ureq = { version = "2", features = ["json", "tls"], default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The widget needs an AppKit collection behavior Tauri does not expose.
objc2 = "0.6"
# Only macOS keeps Claude Code's login in a credential store; Windows and
# Linux keep it in a file we read directly, so this stays out of those builds.
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Parenting the widget to the desktop's WorkerW, likewise.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
